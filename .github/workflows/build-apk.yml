
name: Build Chrono Arbitre APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: |
          mkdir source
          unzip -q chrono-arbitre-main.zip -d source

          GRADLE_FILE=$(find source -name build.gradle.kts -path '*/app/build.gradle.kts' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERREUR : fichier app/build.gradle.kts introuvable"
            echo "Contenu du ZIP :"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$GRADLE_FILE")")
          echo "Projet Android trouvé dans : $PROJECT_DIR"

          sed -i 's/minSdk = 30/minSdk = 26/' "$GRADLE_FILE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Compiler APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Chrono-Arbitre-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
